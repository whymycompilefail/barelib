[permissions]
allow = ["Bash=Get-ChildItem -Path examples -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.exe','.dll','.pdb','.obj','.ilk','.lib','.exp','.vcxproj','.filters','.sln','.recipe' -or $_.Name -in 'CMakeCache.txt','cmake_install.cmake','CTestTestfile.cmake' } | Select-Object -ExpandProperty FullName", "Bash=Get-ChildItem -Path examples -Recurse -Directory -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '\\.(dir|tlog)$' -or $_.Name -eq 'CMakeFiles' -or $_.Name -match '\\.(Debug|Release)$' -or $_.Name -eq 'x64' } | Select-Object -ExpandProperty FullName", "Bash=$exclude = 'D:\\barelib\\.git','D:\\barelib\\bin','D:\\barelib\\build','D:\\barelib\\temp'; Get-ChildItem -Path D:\\barelib -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $p = $_.FullName; -not ($exclude | Where-Object { $p.StartsWith($_) }) -and ($_.Extension -in '.exe','.dll','.pdb','.obj','.ilk','.lib','.exp','.o','.a','.so','.wasm','.data','.tlog','.vcxproj','.filters','.sln','.recipe','.pyc' -or $_.Name -in 'CMakeCache.txt','cmake_install.cmake','CTestTestfile.cmake') } | Select-Object -ExpandProperty FullName", "Edit", "Bash=Select-String -Path D:\\barelib\\spec.txt -Pattern '设计正确|状态正确|零已知缺陷|测试员' -Encoding UTF8 | Select-Object LineNumber, Line | Format-Table -AutoSize -Wrap"]
