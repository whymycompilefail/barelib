name: Parse raylib API

on:
  workflow_dispatch:
  push:
    paths:
      - "src/raylib.h"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update parse files
        working-directory: tools/rlparser
        run: |
          make raylib_api
          mv raylib_api.* output

      - name: Report parse diff (informational only)
        # This fork only uses the parser as a smoke check. Committing the
        # regenerated API files back is upstream's job: on a fork the
        # GITHUB_TOKEN is read-only, so upstream's "git push" step fails (403).
        run: |
          git add -N tools/rlparser/output
          git diff --stat tools/rlparser/output || true
