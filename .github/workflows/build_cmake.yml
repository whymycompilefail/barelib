name: Build raylib CMake - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/build_cmake.yml'
      - 'CMakeLists.txt'
      - 'CMakeOptions.txt'
      - 'cmake/**'
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - '.github/workflows/build_cmake.yml'
      - 'CMakeLists.txt'
      - 'CMakeOptions.txt'
      - 'cmake/**'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  build_windows:
    name: Windows Build
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Build Environment
        # Some projects don't allow in-source building, so create a separate build directory
        # We'll use this as our working directory for all subsequent commands
        run: cmake -E make_directory ${{github.workspace}}/build

      - name: Configure CMake
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: powershell
        working-directory: ${{github.workspace}}/build
        # Note the current convention is to use the -S and -B options here to specify source
        # and build directories, but this is only available with CMake 3.13 and higher.
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: cmake $env:GITHUB_WORKSPACE -DCMAKE_BUILD_TYPE=$env:BUILD_TYPE -DPLATFORM=Desktop

      - name: Build
        working-directory: ${{github.workspace}}/build
        shell: powershell
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build . --config $env:BUILD_TYPE

      - name: Repo hygiene (no tracked build artifacts)
        working-directory: ${{github.workspace}}
        shell: powershell
        # spec R4: compiled binaries (exe/dll) must never be committed; .gitignore
        # covers them, this step fails the build if any slipped in. *.obj is NOT
        # checked: some .obj files are tracked 3D model resources.
        run: |
          $bad = git ls-files '*.exe' '*.dll'
          if ($bad) { Write-Error "Tracked build artifacts: $bad"; exit 1 }
          Write-Host "OK: no tracked build artifacts"

      - name: Test
        working-directory: ${{github.workspace}}/build
        shell: powershell
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # GitHub-hosted runners have no OpenGL 3.3 context, so GPU tests
        # (labelled "gpu": test_gpu, ai_protocol_scenario, ai_close_lifecycle)
        # cannot run here.
        # They still run locally / on self-hosted runners with a real GPU.
        run: ctest -C $env:BUILD_TYPE -LE gpu --output-on-failure

